# 매물 홈페이지 자동 업데이트
# - 15분마다 구글시트/드라이브를 확인해 바뀐 내용이 있으면 홈페이지에 반영
# - GitHub 앱/웹의 Actions 탭 → "매물 홈페이지 업데이트" → Run workflow 버튼으로 즉시 실행 가능
name: 매물 홈페이지 업데이트

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - id: pages
        uses: actions/configure-pages@v5

      - name: 사진 변환 캐시 불러오기
        uses: actions/cache/restore@v4
        with:
          path: .cache/images
          key: images-${{ github.run_id }}
          restore-keys: images-

      - name: 시트·드라이브 읽어서 홈페이지 만들기
        id: publish
        run: node scripts/publish.mjs
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
          FORCE_DEPLOY: ${{ github.event_name != 'schedule' && '1' || '' }}

      - name: 사진 변환 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/images
          key: images-${{ github.run_id }}

      - if: steps.publish.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # GitHub는 60일간 저장소 변경이 없으면 예약 실행을 멈춘다 → 50일마다 기록 1줄 남김
      - name: 예약 실행 유지
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            date -u +%FT%TZ > .github/keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive && git commit -m "예약 실행 유지" && git push
          fi

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
